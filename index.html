<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Count the Steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one big sticker-style board on grid paper. Track on top, code row in the middle, a tray of arrow cards at the bottom to drag up. */
:root {
  --bg: #f7f6ef;
  --grid: #e4e2d3;
  --ink: #26302b;
  --muted: #56625a;
  --card: #ffffff;
  --grass: #5aa454;
  --grass-edge: #357a33;
  --flag: #f2c21b;
  --arrow: #2f62b8;
  --play: #2e8b3a;
  --soft: #fff4c7;
  --good: #1f7a2e;
  --bad: #c23a4f;
  --font: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17221c; --grid: #223128; --ink: #f1f3e6; --muted: #b4c0b5; --card: #1f2d25;
    --grass: #4c9448; --grass-edge: #2c6a2b; --soft: #3a3516; --good: #7fdc8a; --bad: #ff8a9b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17221c; --grid: #223128; --ink: #f1f3e6; --muted: #b4c0b5; --card: #1f2d25;
  --grass: #4c9448; --grass-edge: #2c6a2b; --soft: #3a3516; --good: #7fdc8a; --bad: #ff8a9b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  padding-block: 20px 40px;
  padding-inline: 16px;
  min-height: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--arrow); outline-offset: 3px; }
.app { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px; }
h1 { margin: 0; font-weight: 700; font-size: clamp(32px, 8vw, 52px); line-height: 1; letter-spacing: 1.5px; text-transform: uppercase; text-wrap: balance; }
.lvl { padding: 4px 16px; border-radius: 999px; border: 3px solid var(--ink); background: var(--flag); color: #26302b; font-weight: 700; font-size: 18px; }

.board { background: var(--card); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 7px 0 var(--ink); padding: clamp(14px, 3.5vw, 26px); display: flex; flex-direction: column; gap: 20px; position: relative; }
.prompt { margin: 0; font-weight: 600; font-size: clamp(22px, 5vw, 30px); line-height: 1.2; text-wrap: balance; }

.track-wrap { position: relative; width: 100%; }
.track { display: flex; width: 100%; }
.tile { position: relative; flex: 1 1 0; min-width: 0; aspect-ratio: 1.15 / 1; margin-right: -3px; border: 3px solid var(--grass-edge); border-radius: 16px; background-color: var(--grass); background-image: radial-gradient(circle at 70% 78%, #fff 0 4px, transparent 5px), radial-gradient(circle at 25% 30%, rgba(255,255,255,.18) 0 9px, transparent 10px); }
.tile.done { background-color: #7cc274; }
.badge { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; background: var(--flag); color: #26302b; border: 2.5px solid #26302b; font-weight: 700; font-size: 18px; display: grid; place-items: center; }
.goal { position: absolute; inset: 0; display: grid; place-items: center; }
.goal svg { width: 52%; max-width: 54px; }
.start-pad { position: absolute; left: 12%; right: 12%; bottom: 10%; height: 22%; border-radius: 50%; background: #2f6f2f; opacity: .55; }
.sparky { position: absolute; top: 0; height: 100%; display: grid; place-items: center; pointer-events: none; transition: left .42s cubic-bezier(.3,.8,.4,1); }
.sparky svg { width: 74%; max-width: 70px; overflow: visible; }
.sparky.hop svg { animation: hop .42s; }
.sparky.bump svg { animation: bump .5s; }
.sparky.cheer svg { animation: cheer .6s 2; }

.code { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px; border: 3px dashed var(--muted); border-radius: 18px; transition: background .15s, border-color .15s; }
.code.over { background: var(--soft); border-color: var(--ink); }
.cell { width: clamp(42px, 11vw, 68px); height: clamp(46px, 12vw, 60px); display: grid; place-items: center; flex: none; }
.cell svg { width: 60%; pointer-events: none; }
.blk-start { background: var(--flag); border-radius: 999px 10px 10px 999px; }
.slot { border: 3px dashed var(--muted); border-radius: 10px; }
.slot.fill { border: 0; background: var(--arrow); cursor: grab; touch-action: none; }
.slot.active { outline: 4px solid var(--flag); outline-offset: 2px; transform: translateY(-4px); }
.play { width: clamp(50px, 13vw, 64px); height: clamp(50px, 13vw, 64px); margin-left: auto; border-radius: 50%; border: 0; background: var(--play); display: grid; place-items: center; box-shadow: 0 4px 0 #1b5a24; }
.play:disabled { opacity: .5; cursor: not-allowed; }
.play:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #1b5a24; }
.play svg { width: 52%; }

.tray { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.tray-label { font-weight: 600; font-size: 20px; color: var(--muted); }
.src { width: clamp(84px, 22vw, 116px); height: clamp(60px, 15vw, 78px); border-radius: 14px; background: var(--arrow); display: grid; place-items: center; cursor: grab; touch-action: none; border: 0; box-shadow: 0 5px 0 #1d3f7a; animation: nudge 2.2s ease-in-out infinite; }
.src svg { width: 56%; pointer-events: none; }
.ghost { position: fixed; z-index: 100; pointer-events: none; background: var(--arrow); border-radius: 12px; display: grid; place-items: center; box-shadow: 0 10px 18px rgba(0,0,0,.3); transform: translate(-50%, -50%) rotate(-4deg); }
.ghost svg { width: 56%; }

.btn { min-height: 54px; padding: 8px 26px; border-radius: 16px; border: 3px solid var(--ink); background: var(--flag); color: #26302b; font-weight: 700; font-size: 22px; box-shadow: 0 4px 0 var(--ink); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.plain { background: var(--card); color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

.msg { min-height: 58px; border-radius: 14px; padding: 10px 14px; font-weight: 600; font-size: 21px; line-height: 1.3; background: var(--soft); border: 3px solid transparent; display: flex; align-items: center; }
.msg.good { color: var(--good); border-color: var(--good); }
.msg.bad { color: var(--bad); border-color: var(--bad); }

.end { position: absolute; inset: 0; border-radius: 19px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; z-index: 5; }
.end h2 { margin: 0; font-size: clamp(30px, 8vw, 46px); text-transform: uppercase; text-wrap: balance; }
.end p { margin: 0; max-width: 24ch; font-weight: 600; font-size: 22px; }
.end .pandabig { width: 110px; }

.confetti { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 50; pointer-events: none; animation: fall 2.2s linear forwards; }

@keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-26%); } 100% { transform: translateY(0); } }
@keyframes bump { 0%,100% { transform: translateX(0); } 25% { transform: translateX(14%) rotate(8deg); } 50% { transform: translateX(-6%); } 75% { transform: translateX(8%) rotate(4deg); } }
@keyframes cheer { 0%,100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-22%) rotate(-8deg); } 65% { transform: translateY(-22%) rotate(8deg); } }
@keyframes nudge { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
@media (prefers-reduced-motion: reduce) {
  .sparky { transition: none; }
  .sparky.hop svg, .sparky.bump svg, .sparky.cheer svg, .src { animation: none; }
}
</style>

<div class="app">
  <header>
    <h1>Count the Steps</h1>
    <div class="lvl" id="lvl"></div>
  </header>

  <section class="board">
    <p class="prompt" id="prompt">Drag the arrows up. Help Sparky get to the flower!</p>

    <div class="track-wrap">
      <div class="track" id="track"></div>
      <div class="sparky" id="sparky"></div>
    </div>

    <div class="code" id="code" aria-label="Code row"></div>

    <div class="tray" id="tray">
      <button class="src" id="src" aria-label="Arrow card. Drag it up, or tap to add."></button>
      <span class="tray-label">Drag an arrow up. One arrow is one step.</span>
    </div>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="end" id="end" hidden></div>
  </section>
</div>

<script>
(function () {
  var LEVELS = [3, 4, 3, 5, 4, 6];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var S = { lvl: 0, blocks: 0, busy: false, won: false, pos: 0 };

  var $ = function (id) { return document.getElementById(id); };
  var trackEl = $('track'), sparkyEl = $('sparky'), codeEl = $('code'), msgEl = $('msg');

  var ARROW = '<svg viewBox="0 0 38 24" fill="none" stroke="#e3f0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4v16"/><path d="M10 12h22"/><path d="M25 5l7 7-7 7"/></svg>';
  var FLAG = '<svg viewBox="0 0 26 30" fill="none" stroke="#2f9a2f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 27V3"/><path d="M5 5h17l-5 6 5 6H5" fill="#2f9a2f"/></svg>';
  var PLAY = '<svg viewBox="0 0 28 30" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 27V3"/><path d="M6 5h16l-5 6 5 6H6" fill="#fff"/></svg>';
  var FLOWER = '<svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="10" r="8" fill="#ff7aa8"/><circle cx="41" cy="22" r="8" fill="#ff7aa8"/><circle cx="35" cy="40" r="8" fill="#ff7aa8"/><circle cx="17" cy="40" r="8" fill="#ff7aa8"/><circle cx="11" cy="22" r="8" fill="#ff7aa8"/><circle cx="26" cy="26" r="7" fill="#f2c21b"/></svg>';
  var PANDA = '<svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="13" cy="14" r="8" fill="#26302b"/><circle cx="43" cy="14" r="8" fill="#26302b"/><circle cx="28" cy="31" r="21" fill="#fff" stroke="#26302b" stroke-width="2.5"/><ellipse cx="19" cy="29" rx="5.5" ry="7" fill="#26302b"/><ellipse cx="37" cy="29" rx="5.5" ry="7" fill="#26302b"/><circle cx="19" cy="28" r="2.2" fill="#fff"/><circle cx="37" cy="28" r="2.2" fill="#fff"/><ellipse cx="28" cy="38" rx="3" ry="2.2" fill="#26302b"/></svg>';

  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, reduce ? Math.min(ms, 150) : ms); }); };
  var tiles = function () { return LEVELS[S.lvl]; };
  var steps = function () { return LEVELS[S.lvl] - 1; };
  var slotCount = function () { return steps() + 2; };
  function say(t, kind) { msgEl.textContent = t; msgEl.className = 'msg' + (kind ? ' ' + kind : ''); }

  /* ---------- sound ---------- */
  var ac = null;
  function tone(f, d, type, when, g) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), v = ac.createGain(), t = ac.currentTime + (when || 0);
      o.type = type || 'triangle'; o.frequency.value = f;
      v.gain.setValueAtTime(g || 0.1, t); v.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(v); v.connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  }
  var sfx = {
    add: function () { tone(520, 0.08); },
    drop: function () { tone(420, 0.1); },
    hop: function (k) { tone(260 + k * 45, 0.16, 'square', 0, 0.05); },
    bad: function () { tone(180, 0.28, 'sawtooth', 0, 0.06); },
    win: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.22, 'triangle', i * 0.12); }); }
  };

  /* ---------- drawing ---------- */
  function drawTrack() {
    var n = tiles(), h = '';
    for (var i = 0; i < n; i++) {
      h += '<div class="tile">' + (i === 0 ? '<span class="start-pad"></span>' : '') + (i === n - 1 ? '<span class="goal">' + FLOWER + '</span>' : '') + '</div>';
    }
    trackEl.innerHTML = h;
    sparkyEl.innerHTML = PANDA;
    sparkyEl.style.width = (100 / n) + '%';
    S.pos = 0; place(0, false);
  }
  function place(i, hop) {
    sparkyEl.style.left = (i * 100 / tiles()) + '%';
    if (hop) { sparkyEl.classList.remove('hop'); void sparkyEl.offsetWidth; sparkyEl.classList.add('hop'); }
  }
  function badge(k, num) {
    var t = trackEl.children[k]; if (!t) return;
    var b = t.querySelector('.badge');
    if (num == null) { if (b) b.remove(); t.classList.remove('done'); return; }
    if (!b) { b = document.createElement('span'); b.className = 'badge'; t.appendChild(b); }
    b.textContent = num; t.classList.add('done');
  }
  function clearBadges() { for (var k = 1; k < tiles(); k++) badge(k, null); }

  function drawCode() {
    var h = '<div class="cell blk-start" aria-label="Start">' + FLAG + '</div>';
    for (var i = 0; i < slotCount(); i++) {
      h += '<div class="cell slot' + (i < S.blocks ? ' fill' : '') + '" data-s="' + i + '"' + (i < S.blocks ? ' aria-label="Arrow card"' : '') + '>' + (i < S.blocks ? ARROW : '') + '</div>';
    }
    h += '<button class="play" id="play" aria-label="Play"' + (S.busy || S.won ? ' disabled' : '') + '>' + PLAY + '</button>';
    codeEl.innerHTML = h;
  }

  function setLevel(i) {
    S.lvl = i; S.blocks = 0; S.busy = false; S.won = false;
    $('end').hidden = true;
    $('lvl').textContent = 'Level ' + (i + 1) + ' of ' + LEVELS.length;
    $('prompt').textContent = 'Drag the arrows up. Help Sparky get to the flower!';
    $('tray').hidden = false;
    drawTrack(); drawCode();
    say('Count the tiles after Sparky. Drag one arrow for each step.');
  }

  /* ---------- drag and drop (pointer events, works with touch) ---------- */
  var drag = null;
  function startDrag(ev, kind, w, h) {
    if (S.busy || S.won) return;
    ev.preventDefault();
    var g = document.createElement('div');
    g.className = 'ghost'; g.innerHTML = ARROW;
    g.style.width = w + 'px'; g.style.height = h + 'px';
    document.body.appendChild(g);
    drag = { kind: kind, g: g, x0: ev.clientX, y0: ev.clientY, moved: false };
    moveGhost(ev);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  }
  function moveGhost(ev) {
    drag.g.style.left = ev.clientX + 'px'; drag.g.style.top = ev.clientY + 'px';
    if (Math.abs(ev.clientX - drag.x0) + Math.abs(ev.clientY - drag.y0) > 8) drag.moved = true;
  }
  function overCode(ev) {
    var r = codeEl.getBoundingClientRect(), p = 14;
    return ev.clientX > r.left - p && ev.clientX < r.right + p && ev.clientY > r.top - p && ev.clientY < r.bottom + p;
  }
  function onMove(ev) {
    if (!drag) return;
    moveGhost(ev);
    codeEl.classList.toggle('over', overCode(ev));
  }
  function endDrag() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    if (drag) drag.g.remove();
    codeEl.classList.remove('over');
    drag = null;
  }
  function onCancel() { endDrag(); }
  function onUp(ev) {
    if (!drag) return;
    var d = drag, inCode = overCode(ev);
    endDrag();
    if (d.kind === 'new') {
      if (!d.moved || inCode) add();
    } else {
      if (!d.moved || !inCode) remove();
    }
  }
  function add() {
    if (S.blocks >= slotCount()) { say('The row is full. Drag an arrow out to take it away.', 'bad'); sfx.bad(); return; }
    S.blocks++; sfx.drop(); drawCode(); say('');
  }
  function remove() {
    if (S.blocks === 0) return;
    S.blocks--; sfx.add(); drawCode(); say('');
  }

  $('src').addEventListener('pointerdown', function (ev) {
    var r = this.getBoundingClientRect();
    startDrag(ev, 'new', r.width * 0.6, r.height * 0.8);
  });
  codeEl.addEventListener('pointerdown', function (ev) {
    var s = ev.target.closest('.slot.fill');
    if (!s) return;
    var r = s.getBoundingClientRect();
    startDrag(ev, 'placed', r.width, r.height);
  });
  $('src').addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); add(); } });

  /* ---------- run ---------- */
  async function run() {
    if (S.busy || S.won) return;
    if (S.blocks === 0) { say('Drag some arrows into the row first.', 'bad'); sfx.bad(); return; }
    S.busy = true; S.pos = 0; clearBadges(); place(0, false); drawCode();
    say('Sparky is walking...');
    await sleep(350);
    var bumped = false;
    for (var i = 0; i < S.blocks; i++) {
      var s = codeEl.querySelectorAll('.slot')[i]; if (s) s.classList.add('active');
      await sleep(250);
      if (S.pos < tiles() - 1) { S.pos++; place(S.pos, true); badge(S.pos, S.pos); sfx.hop(S.pos); }
      else { bumped = true; sparkyEl.classList.remove('bump'); void sparkyEl.offsetWidth; sparkyEl.classList.add('bump'); sfx.bad(); }
      await sleep(520);
      if (s) s.classList.remove('active');
      if (bumped) break;
    }
    var need = steps();
    if (S.pos === tiles() - 1 && S.blocks === need) { win(); return; }
    sfx.bad();
    if (S.pos < tiles() - 1) {
      var left = need - S.pos;
      say('Sparky stopped ' + left + (left === 1 ? ' step' : ' steps') + ' before the flower. Add more arrows!', 'bad');
    } else {
      say('Too many arrows! The flower is only ' + need + ' steps away. Drag some out.', 'bad');
    }
    await sleep(1100);
    S.pos = 0; clearBadges(); place(0, false);
    S.busy = false; drawCode();
  }

  function win() {
    sfx.win(); confetti();
    sparkyEl.classList.remove('cheer'); void sparkyEl.offsetWidth; sparkyEl.classList.add('cheer');
    S.busy = false; S.won = true; drawCode();
    var last = S.lvl === LEVELS.length - 1;
    $('prompt').textContent = 'Hooray! Sparky found the flower!';
    $('tray').hidden = true;
    codeEl.insertAdjacentHTML('afterend', '<div class="row" id="after"><button class="btn" id="next">' + (last ? 'Finish' : 'Next level') + '</button><button class="btn plain" id="again">Play again</button></div>');
    say(S.blocks + ' arrows for ' + steps() + ' steps. You counted right!', 'good');
  }

  function confetti() {
    if (reduce) return;
    var colors = ['#f2c21b', '#2f62b8', '#ff7aa8', '#2e8b3a', '#ff8a3d'];
    for (var i = 0; i < 44; i++) {
      var c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDelay = (Math.random() * 0.5) + 's';
      c.style.animationDuration = (1.8 + Math.random() * 1.2) + 's';
      document.body.appendChild(c);
      setTimeout((function (n) { return function () { n.remove(); }; })(c), 3600);
    }
  }

  function showEnd() {
    var e = $('end');
    e.innerHTML = '<div class="pandabig">' + PANDA + '</div><h2>You did it!</h2><p>Sparky reached every flower. Great counting!</p><button class="btn" id="restart">Play again</button>';
    e.hidden = false; confetti();
  }

  function clearAfter() { var a = $('after'); if (a) a.remove(); }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button'); if (!t) return;
    if (t.id === 'play') run();
    else if (t.id === 'again') { clearAfter(); setLevel(S.lvl); }
    else if (t.id === 'next') { clearAfter(); if (S.lvl === LEVELS.length - 1) showEnd(); else setLevel(S.lvl + 1); }
    else if (t.id === 'restart') { clearAfter(); setLevel(0); }
  });

  setLevel(0);
})();
</script>

</body></html>
